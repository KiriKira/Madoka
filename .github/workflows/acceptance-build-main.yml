name: Acceptance build main baseline (Madoka)
on:
  push:
    paths:
      - '.github/workflows/acceptance-build-main.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build
        run: ./gradlew -PrtcEmulator=true -PrtcLabRunner=com.callagent.lab.HostJointInstrumentation :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Madoka-main-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            sha256.txt
          if-no-files-found: error
