name: Acceptance build (Madoka)
on:
  push:
    paths:
      - '.github/workflows/acceptance-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        variant: [emu, relay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build ${{ matrix.variant }}
        run: |
          set -euo pipefail
          EXTRA="-PrtcEmulator=true -PrtcLabRunner=com.callagent.lab.HostJointInstrumentation"
          if [ "${{ matrix.variant }}" = "relay" ]; then EXTRA="$EXTRA -PforceRtcRelay=true"; fi
          ./gradlew $EXTRA :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Record hashes
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
                    app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee sha256.txt
      - name: Verify ABI and relay flag
        run: |
          python3 - <<'PY'
          import zipfile,sys
          z=zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk')
          abis=sorted({n.split('/')[1] for n in z.namelist() if n.startswith('lib/')})
          print('abis',abis)
          assert 'x86_64' in abis, 'missing x86_64'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Madoka-${{ matrix.variant }}-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            sha256.txt
          if-no-files-found: error

# trigger: force rebuild for joint acceptance APKs
